server:
  port: ${PORT:8088}
spring:
  # 本地开发配置（数据库密码、JWT 密钥）放在不入库的 application-local.yml 中，模板见 application-local.yml.example
  config:
    import: optional:file:./application-local.yml
  datasource:
    # 未设置环境变量时使用本地默认值；密码请通过环境变量 DB_PASSWORD 或本地 application-local.yml 提供
    url: ${DB_URL:jdbc:mysql://localhost:3306/movie_info1707?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    # Render Free Key Value 用内部 redis:// URL；Upstash 用 rediss:// 并设置 REDIS_SSL=true
    url: ${REDIS_URL:redis://localhost:6379}
    ssl: ${REDIS_SSL:false}
    timeout: 1s
    connect-timeout: 1s
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: false
  global-config:
    db-config:
      table-underline: false
jwt:
  # JWT 签名密钥：环境变量 JWT_SECRET 优先；缺失且本地文件未配置时后端启动即失败（fail-fast）
  secret: ${JWT_SECRET:}
app:
  cache:
    # 热点缓存总开关：默认关闭；关闭时 NoOp 实现，不建立任何 Redis 连接
    enabled: ${CACHE_ENABLED:false}
    hot-ttl-seconds: 300
    list-ttl-seconds: 300
    detail-ttl-seconds: 300
    search-ttl-seconds: 180
    report-ttl-seconds: 600
    null-ttl-seconds: 60
    version-ttl-seconds: 86400
    lock-ttl-seconds: 10
    circuit-open-seconds: 30