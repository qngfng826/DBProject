# 电影评分系统本地全栈部署（Docker Desktop / WSL2）
# 用法：cp .env.example .env 并填入密钥，然后 docker compose up -d --build
# 说明：
#   - MySQL 容器映射到宿主机 3307，与本机正在运行的 MySQL96(3306) / MySQL84(3305) 互不干扰
#   - 数据库初始化：首次启动自动执行 deploy/init.sql（8 表 + 种子数据 + 视图）
#   - 前端 Nginx 把 /api 反代到 backend 容器，浏览器只需访问 http://localhost:8080
services:
  mysql:
    image: mysql:8.4
    container_name: movie-rating-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先复制 .env.example 为 .env 并填入 MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  redis:
    image: valkey/valkey:8-alpine
    container_name: movie-rating-redis
    ports:
      - "6379:6379"
    # 纯缓存场景不落盘，重启即清空
    command: ["--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./Movie_Rating_Backend
    image: movie-rating-backend:local
    container_name: movie-rating-backend
    environment:
      PORT: 8088
      DB_URL: jdbc:mysql://mysql:3306/movie_info1707?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请先复制 .env.example 为 .env 并填入 JWT_SECRET}
      REDIS_URL: redis://redis:6379
      # A/B 压测基线时可临时改为 false（.env 或 shell 环境变量）
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      JAVA_OPTS: "-Xms128m -Xmx512m"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8088'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./movie-rating-frontend
      args:
        VITE_API_BASE_URL: /api
    image: movie-rating-frontend:local
    container_name: movie-rating-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  mysql-data:
